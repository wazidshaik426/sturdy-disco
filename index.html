<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(3, 1fr) auto;
            gap: 12px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete {
            background: #dc2626;
        }

        .edit {
            background: #16a34a;
            margin-right: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .form {
                grid-template-columns: 1fr;
            }

            .card {
                overflow-x: auto;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <div class="card">
        <h2>Add Student</h2>

        <div class="form">
            <input type="text" id="name" placeholder="Student Name">
            <input type="number" id="age" placeholder="Age">
            <input type="email" id="email" placeholder="Email">
            <button onclick="addStudent()">Add Student</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <div class="card">
        <h2>Students</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>
    </div>

</div>

<script>
    // Temporary frontend data.
    // Later this will be replaced with your Spring Boot + JDBC API.
    let students = [];
    let nextId = 1;

    function addStudent() {
        const name = document.getElementById("name").value.trim();
        const age = document.getElementById("age").value;
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("message");

        if (!name || !age || !email) {
            message.textContent = "Please fill all fields.";
            return;
        }

        const student = {
            id: nextId++,
            name: name,
            age: Number(age),
            email: email
        };

        students.push(student);

        message.textContent = "Student added successfully.";

        document.getElementById("name").value = "";
        document.getElementById("age").value = "";
        document.getElementById("email").value = "";

        displayStudents();
    }

    function displayStudents() {
        const table = document.getElementById("studentTable");

        table.innerHTML = "";

        students.forEach(student => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>${student.age}</td>
                <td>${student.email}</td>
                <td>
                    <button class="edit" onclick="editStudent(${student.id})">
                        Edit
                    </button>
                    <button class="delete" onclick="deleteStudent(${student.id})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });
    }

    function editStudent(id) {
        const student = students.find(s => s.id === id);

        if (!student) return;

        const newName = prompt("Enter student name:", student.name);
        const newAge = prompt("Enter age:", student.age);
        const newEmail = prompt("Enter email:", student.email);

        if (newName && newAge && newEmail) {
            student.name = newName;
            student.age = Number(newAge);
            student.email = newEmail;

            displayStudents();
        }
    }

    function deleteStudent(id) {
        students = students.filter(student => student.id !== id);
        displayStudents();
    }
</script>

</body>
</html>
